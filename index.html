<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="version" content="v15" />
<title>Zoom Meeting Timer</title>
<style>
  /* ========== ADJUSTABLE VARIABLES ========== */
  :root {
    /* CLOCK */
    --clock-font-size: 3rem;       /* font-size px = 48px */
    --clock-margin-bottom: 1px;  /* jarak clock ke timer */
    --clock-font-weight: 700;
    --clock-color: #e8e8ed;
    --clock-letter-spacing: 1px;

    /* TIMER DISPLAY — responsive: fills width with margin */
    --timer-font-size: clamp(4rem, 22vw, 12rem);  /* min 64px, scales, max 192px */
    --timer-color-normal: #e8e8ed;
    --timer-color-running: #4ade80;
    --timer-color-warning: #facc15;
    --timer-color-danger: #fb923c;
    --timer-color-overtime: #f87171;

    /* TIMER LABEL */
    --label-font-size: 1rem;       /* "X remaining" */
    --label-color: #666;
    --label-margin-top: 4px;
    --label-overtime-bg: #b91c1c;  /* background merah pas overtime */
    --label-overtime-color: #fff;  /* teks putih pas overtime */
    --label-overtime-padding: 4px 14px;
    --label-overtime-radius: 8px;

    /* TIMER AREA */
    --timer-area-min-height: 230px;

    /* CONTAINER */
    --container-gap: 12px;
    --container-padding: 40px;
    --container-max-width: 720px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f11;
    color: #e8e8ed;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 20px;
    user-select: none;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--container-gap);
    padding: var(--container-padding);
    width: 100%;
    max-width: var(--container-max-width);
  }

  /* --- Timer area (fixed height, top-align — label pushes DOWN, not up) --- */
  .timer-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 20px;
    min-height: var(--timer-area-min-height);
    width: 100%;
  }

  /* --- Clock --- */
  .clock {
    font-size: var(--clock-font-size);
    font-weight: var(--clock-font-weight);
    color: var(--clock-color);
    letter-spacing: var(--clock-letter-spacing);
    font-variant-numeric: tabular-nums;
    margin-bottom: var(--clock-margin-bottom);
  }

  /* --- Timer (big) --- */
  .timer-display {
    font-size: var(--timer-font-size);
    font-weight: 600;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color 0.3s ease;
    color: var(--timer-color-normal);
    width: 100%;
    text-align: center;
    padding: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .timer-display.running  { color: var(--timer-color-running); }
  .timer-display.warning  { color: var(--timer-color-warning); }
  .timer-display.danger   { color: var(--timer-color-danger); }
  .timer-display.overtime { color: var(--timer-color-overtime); }

  /* --- Timer label (subtitle) --- */
  .timer-label {
    font-size: var(--label-font-size);
    color: var(--label-color);
    margin-top: var(--label-margin-top);
    min-height: 1.4rem;
    transition: all 0.3s ease;
    border-radius: 0;
    padding: 0;
  }

  .timer-label.overtime {
    color: var(--label-overtime-color);
    background: var(--label-overtime-bg);
    padding: var(--label-overtime-padding);
    border-radius: var(--label-overtime-radius);
  }

  /* --- Preset buttons --- */
  .presets {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 28px;
  }

  .preset-btn {
    background: #1c1c1e;
    border: 1px solid #2c2c2e;
    color: #a1a1ab;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .preset-btn:hover {
    background: #2c2c2e;
    color: #e8e8ed;
    border-color: #3a3a3c;
  }

  .preset-btn.active {
    background: #2563eb;
    border-color: #3b82f6;
    color: #fff;
  }

  .preset-btn.custom-active {
    background: #1e40af;
    border-color: #2563eb;
    color: #fff;
  }

  /* --- Controls --- */
  .controls {
    display: flex;
    gap: 14px;
    margin-top: 20px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-btn {
    padding: 12px 32px;
    border-radius: 12px;
    border: none;
    font-size: 1.05rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .ctrl-btn:active { transform: scale(0.96); }

  .ctrl-btn.start  { background: #2563eb; color: #fff; }
  .ctrl-btn.start:hover  { background: #3b82f6; }
  .ctrl-btn.pause  { background: #7c3aed; color: #fff; }
  .ctrl-btn.pause:hover  { background: #8b5cf6; }
  .ctrl-btn.reset  { background: #3f3f46; color: #d4d4d8; }
  .ctrl-btn.reset:hover  { background: #52525b; }
  .ctrl-btn.extend { background: #059669; color: #fff; }
  .ctrl-btn.extend:hover { background: #10b981; }

  .ctrl-btn.mini  { background: #1c1c1e; color: #a1a1ab; border: 1px solid #2c2c2e; }
  .ctrl-btn.mini:hover { background: #2c2c2e; color: #e8e8ed; }

  .ctrl-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  /* --- Custom time input --- */
  .custom-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .custom-input-row input {
    background: #1c1c1e;
    border: 1px solid #2c2c2e;
    color: #e8e8ed;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 1rem;
    width: 80px;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }

  .custom-input-row input:focus {
    outline: none;
    border-color: #3b82f6;
  }

  .custom-input-row label {
    color: #888894;
    font-size: 0.9rem;
  }

  /* --- Status message --- */
  .status-msg {
    font-size: 1.1rem;
    min-height: 1.6rem;
    color: #a1a1ab;
  }

  /* --- Version footer (paling bawah, kecil) --- */
  .version-footer {
    position: fixed;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 1.1rem;
    color: #55555c;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }

  /* --- Extend button flash animation --- */
  .ctrl-btn.extend.flash {
    background: #f59e0b;
    color: #000;
    animation: pulse-glow 1s ease-in-out 3;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
    50% { box-shadow: 0 0 20px 4px rgba(245, 158, 11, 0.6); }
  }

  @media (max-width: 480px) {
    .timer-display { font-size: 4.5rem; }
    .container { padding: 20px; gap: 8px; }
    .preset-btn { padding: 8px 16px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="timer-area" id="timerArea">
    <div class="clock" id="clockDisplay"></div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-label" id="timerLabel">Ready</div>
  </div>

  <div class="presets" id="presets">
    <button class="preset-btn" data-minutes="5">5 min</button>
    <button class="preset-btn" data-minutes="10">10 min</button>
    <button class="preset-btn" data-minutes="15">15 min</button>
    <button class="preset-btn active" data-minutes="30">30 min</button>
    <button class="preset-btn" data-minutes="45">45 min</button>
    <button class="preset-btn" data-minutes="60">60 min</button>
    <button class="preset-btn" data-minutes="90">90 min</button>
    <button class="preset-btn" id="customBtn">Custom</button>
  </div>

  <div class="custom-input-row" id="customRow" style="display:none;">
    <label>Set:</label>
    <input type="number" id="customMin" value="25" min="1" max="999" /> <label>min</label>
    <input type="number" id="customSec" value="0" min="0" max="59" /> <label>sec</label>
    <button class="preset-btn custom-active" onclick="applyCustom()">Apply</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn start" id="startBtn" onclick="startTimer()">▶ Start</button>
    <button class="ctrl-btn pause" id="pauseBtn" onclick="pauseTimer()" disabled>⏸ Pause</button>
    <button class="ctrl-btn reset" id="resetBtn" onclick="resetTimer()">↺ Reset</button>
    <button class="ctrl-btn extend" id="extendBtn" onclick="quickExtend()">+ Extend</button>
    <button class="ctrl-btn mini" id="pipBtn" onclick="openPip()">⧉ Mini</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>
</div>

<div class="version-footer" id="versionFooter"></div>

<script>
// =================== STATE ===================
let state = {
  remaining: 0,
  initialDuration: 0,
  running: false,
  paused: false,
  overtime: false,
  overtimeBeepFired: false,
  beeped5: false,
  beeped1: false,
  beeped0: false,
  selectedMinutes: 30,
  interval: null,
};

// =================== DOM REFS ===================
const timerDisplay = document.getElementById('timerDisplay');
const timerLabel = document.getElementById('timerLabel');
const clockDisplay = document.getElementById('clockDisplay');
const statusMsg = document.getElementById('statusMsg');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const extendBtn = document.getElementById('extendBtn');
const presetsContainer = document.getElementById('presets');
const customRow = document.getElementById('customRow');
const customBtn = document.getElementById('customBtn');

// =================== PICTURE-IN-PICTURE STATE ===================
// (dideklarasi di atas karena updateClock() menyentuh pipClockEl tiap detik)
let pipWindow = null;
let pipTimerEl = null;
let pipClockEl = null;

// =================== AUDIO ===================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBeep(frequency, duration, type = 'sine', volume = 0.3) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = frequency;
    gain.gain.value = volume;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) { /* audio not available */ }
}

function playWarningBeep() {
  playBeep(880, 0.15, 'square', 0.25);
  setTimeout(() => playBeep(880, 0.15, 'square', 0.25), 200);
}

function playUrgentBeep() {
  playBeep(660, 0.1, 'square', 0.3);
  setTimeout(() => playBeep(880, 0.1, 'square', 0.3), 120);
  setTimeout(() => playBeep(1100, 0.1, 'square', 0.3), 240);
}

function playTimeUp() {
  playBeep(800, 0.4, 'sawtooth', 0.35);
  setTimeout(() => playBeep(600, 0.4, 'sawtooth', 0.35), 450);
  setTimeout(() => playBeep(400, 0.6, 'sawtooth', 0.3), 900);
}

// =================== CLOCK ===================
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const t = `${h}:${m}`;
  clockDisplay.textContent = t;
  if (pipClockEl) pipClockEl.textContent = t;
}
updateClock();
setInterval(updateClock, 1000);

// =================== TIMER DISPLAY ===================
function formatTime(totalSec) {
  const abs = Math.abs(totalSec);
  const h = Math.floor(abs / 3600);
  const m = Math.floor((abs % 3600) / 60);
  const s = Math.floor(abs % 60);
  const sign = totalSec <= 0 ? '-' : '';
  if (h > 0) return `${sign}${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${sign}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m > 0 && s > 0) return `${m}m ${s}s`;
  if (m > 0) return `${m} min`;
  return `${s}s`;
}

// =================== AUTOFIT ===================
// Menjaga teks timer selalu utuh (tidak ke-ellipsis "-00:..").
// Font-size dipakai sebesar CSS clamp-nya, otomatis mengecil HANYA
// kalau lebar teks melebihi kontainer (mis. font sistem Linux lebih lebar).
function autofitTimer() {
  const el = timerDisplay;
  el.style.fontSize = ''; // reset ke nilai CSS (clamp)
  const availW = el.clientWidth;
  const contentW = el.scrollWidth;
  if (contentW > availW && contentW > 0) {
    const curSize = parseFloat(getComputedStyle(el).fontSize);
    const scale = (availW / contentW) * 0.97; // margin 3% biar nggak nempel
    el.style.fontSize = `${(curSize * scale).toFixed(1)}px`;
  }
}

function updateDisplay() {
  timerDisplay.textContent = formatTime(state.remaining);
  autofitTimer();
  syncPip();

  timerDisplay.classList.remove('running', 'warning', 'danger', 'overtime');
  if (state.overtime) {
    timerDisplay.classList.add('overtime');
  } else if (state.running || state.paused) {
    if (state.remaining <= 60) {
      timerDisplay.classList.add('danger');
    } else if (state.remaining <= 300) {
      timerDisplay.classList.add('warning');
    } else {
      timerDisplay.classList.add('running');
    }
  }

  if (state.overtime) {
    const ot = Math.abs(state.remaining);
    timerLabel.textContent = `Overtime: +${formatDuration(Math.floor(ot))}`;
    timerLabel.classList.add('overtime');
  } else if (state.running || state.paused) {
    timerLabel.textContent = `${formatDuration(Math.floor(state.remaining))} remaining`;
    timerLabel.classList.remove('overtime');
  } else {
    timerLabel.textContent = state.initialDuration > 0
      ? `${formatDuration(state.initialDuration)} — Ready`
      : 'Ready';
    timerLabel.classList.remove('overtime');
  }

  startBtn.disabled = state.running;
  startBtn.textContent = state.running ? '▶ Start' : (state.paused ? '▶ Resume' : '▶ Start');
  pauseBtn.disabled = !state.running;
  extendBtn.disabled = false;
}

// =================== TIMER LOGIC ===================
function tick() {
  if (!state.running) return;

  state.remaining -= 1;

  if (!state.overtime) {
    if (state.remaining <= 300 && !state.beeped5) {
      state.beeped5 = true;
      playWarningBeep();
      statusMsg.textContent = '⚠️ 5 minutes remaining';
      setTimeout(() => { if (!state.overtime) statusMsg.textContent = ''; }, 4000);
    }
    if (state.remaining <= 60 && !state.beeped1) {
      state.beeped1 = true;
      playUrgentBeep();
      statusMsg.textContent = '⚠️ 1 minute remaining!';
      setTimeout(() => { if (!state.overtime) statusMsg.textContent = ''; }, 4000);
    }
  }

  // Hit zero → enter overtime, keep running
  if (state.remaining <= 0 && !state.overtime) {
    state.overtime = true;
    state.overtimeBeepFired = false;
    playTimeUp();
    statusMsg.textContent = '⏰ Time is up!';
    extendBtn.classList.add('flash');
    setTimeout(() => extendBtn.classList.remove('flash'), 3000);
  }

  // Overtime beep every 60s
  if (state.overtime && !state.overtimeBeepFired && state.remaining % 60 === 0) {
    state.overtimeBeepFired = true;
    playUrgentBeep();
  }
  if (state.overtime && state.remaining % 60 !== 0) {
    state.overtimeBeepFired = false;
  }

  updateDisplay();
}

// =================== CONTROLS ===================
function setTimer(seconds) {
  if (state.running) return;
  state.initialDuration = seconds;
  state.remaining = seconds;
  state.overtime = false;
  state.overtimeBeepFired = false;
  state.beeped5 = false;
  state.beeped1 = false;
  state.beeped0 = false;
  state.paused = false;
  if (state.interval) { clearInterval(state.interval); state.interval = null; }
  timerLabel.classList.remove('overtime');
  updateDisplay();
}

function startTimer() {
  if (state.remaining <= 0) return;
  if (state.running) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  state.running = true;
  state.paused = false;
  statusMsg.textContent = '';

  state.interval = setInterval(tick, 1000);
  updateDisplay();
}

function pauseTimer() {
  if (!state.running) return;
  state.running = false;
  state.paused = true;
  clearInterval(state.interval);
  state.interval = null;
  updateDisplay();
}

function resetTimer() {
  clearInterval(state.interval);
  state.interval = null;
  state.running = false;
  state.paused = false;
  state.overtime = false;
  state.overtimeBeepFired = false;
  state.beeped5 = false;
  state.beeped1 = false;
  state.beeped0 = false;
  state.remaining = state.initialDuration;
  statusMsg.textContent = '';
  extendBtn.classList.remove('flash');
  timerLabel.classList.remove('overtime');
  updateDisplay();
}

// =================== EXTEND ===================
function quickExtend() {
  const addSec = state.selectedMinutes * 60;
  state.remaining += addSec;
  state.overtime = false;
  state.overtimeBeepFired = false;
  state.beeped5 = false;
  state.beeped1 = false;
  state.beeped0 = false;
  extendBtn.classList.remove('flash');
  timerLabel.classList.remove('overtime');
  statusMsg.textContent = `⏱ Extended +${state.selectedMinutes} min`;
  setTimeout(() => { if (!state.overtime) statusMsg.textContent = ''; }, 3000);

  if (!state.running && state.remaining > 0) {
    state.paused = false;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    state.running = true;
    state.interval = setInterval(tick, 1000);
  }

  updateDisplay();
}

// =================== PRESETS ===================
presetsContainer.addEventListener('click', (e) => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  if (btn.id === 'customBtn') {
    customRow.style.display = customRow.style.display === 'none' ? 'flex' : 'none';
    return;
  }
  customRow.style.display = 'none';

  const mins = parseInt(btn.dataset.minutes);
  if (isNaN(mins)) return;

  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  state.selectedMinutes = mins;

  if (!state.running && !state.paused) {
    setTimer(mins * 60);
  } else {
    statusMsg.textContent = `Selected: +${mins} min for Extend`;
    setTimeout(() => statusMsg.textContent = '', 2000);
    updateDisplay();
  }
});

function applyCustom() {
  const m = parseInt(document.getElementById('customMin').value) || 0;
  const s = parseInt(document.getElementById('customSec').value) || 0;
  const total = m * 60 + s;
  if (total <= 0) return;

  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  customBtn.classList.add('active');
  customRow.style.display = 'none';

  state.selectedMinutes = Math.ceil(total / 60);

  if (!state.running && !state.paused) {
    setTimer(total);
  } else {
    statusMsg.textContent = `Selected: +${Math.ceil(total / 60)} min for Extend`;
    setTimeout(() => statusMsg.textContent = '', 2000);
    updateDisplay();
  }
}

// =================== PICTURE-IN-PICTURE (Mini) ===================
// Window kecil always-on-top tanpa chrome browser — timer di pojok layar.
// (pipWindow/pipTimerEl/pipClockEl dideklarasi di atas, lihat bagian state)

async function openPip() {
  if (!('documentPictureInPicture' in window)) {
    statusMsg.textContent = 'PiP tidak didukung browser ini (butuh Chrome/Brave 116+)';
    setTimeout(() => statusMsg.textContent = '', 4000);
    return;
  }
  try {
    if (!pipWindow) {
      pipWindow = await documentPictureInPicture.requestWindow({
        width: 360, height: 170,
        disallowReturnToOpener: true,   // hilangkan tombol "back to tab" di top bar
        preferInitialWindowPlacement: true,
      });
      pipWindow.document.title = '';    // kosongkan judul → title bar lebih bersih
      pipWindow.document.body.innerHTML = `
        <style>
          :root { color-scheme: dark; }  /* title bar ikut gelap, bukan putih */
          html, body { margin: 0; height: 100%; background: #0f0f11; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; user-select: none; }
          #pipClock { font-family: system-ui, sans-serif; font-weight: 600;
            font-size: min(9vw, 11vh); line-height: 1; color: #8a8a93;
            font-variant-numeric: tabular-nums; letter-spacing: 1px; }
          #pipTimer { font-family: system-ui, sans-serif; font-weight: 700;
            font-size: min(30vw, 38vh); line-height: 1; color: #e8e8ed;
            font-variant-numeric: tabular-nums; letter-spacing: 1px;
            white-space: nowrap; max-width: 100%; }
          #pipTimer.ot { color: #f87171; }
        </style>
        <div id="pipClock">00:00</div>
        <div id="pipTimer">00:00</div>`;
      pipTimerEl = pipWindow.document.getElementById('pipTimer');
      pipClockEl = pipWindow.document.getElementById('pipClock');
      pipWindow.addEventListener('pagehide', () => {
        pipWindow = null; pipTimerEl = null; pipClockEl = null;
      });
    } else {
      pipWindow.focus();
    }
    syncPip();
  } catch (e) {
    statusMsg.textContent = 'Gagal buka PiP: ' + e.message;
    setTimeout(() => statusMsg.textContent = '', 4000);
  }
}

function syncPip() {
  if (!pipTimerEl) return;
  pipTimerEl.textContent = formatTime(state.remaining);
  pipTimerEl.classList.toggle('ot', state.overtime);
  // autofit sama kayak halaman utama: mengecil hanya kalau overflow (mis. minus overtime)
  pipTimerEl.style.fontSize = '';
  const availW = pipTimerEl.clientWidth;
  const contentW = pipTimerEl.scrollWidth;
  if (contentW > availW && contentW > 0) {
    const cur = parseFloat(getComputedStyle(pipTimerEl).fontSize);
    pipTimerEl.style.fontSize = `${(cur * (availW / contentW) * 0.97).toFixed(1)}px`;
  }
}

// =================== KEYBOARD SHORTCUTS ===================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (state.running) pauseTimer();
      else startTimer();
      break;
    case 'r':
    case 'R':
      resetTimer();
      break;
    case 'e':
    case 'E':
      quickExtend();
      break;
  }
});

// =================== INIT ===================
setTimer(30 * 60);
autofitTimer();
window.addEventListener('resize', autofitTimer);

// Version footer — baca dari meta, biar ketahuan cache ke-refresh atau belum
document.getElementById('versionFooter').textContent =
  (document.querySelector('meta[name="version"]') || {}).content || '?';
</script>
</body>
</html>
